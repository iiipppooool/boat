# Fly.io deployment. `fly launch --no-deploy` then `fly deploy`.
#
# The volume is the important part: SQLite needs a filesystem that survives a
# redeploy, and DATABASE_PATH points at it. Without the volume every deploy
# would silently reset the database to seed data.

app = "boatxchange"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/boatxchange.db"
  NEXT_PUBLIC_SITE_URL = "https://boatxchange.fly.dev"

[[mounts]]
  source = "boatxchange_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine, because SQLite is a single-writer database. Scaling past this
  # means moving to Postgres first — see DEPLOY.md.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
